[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logit"
version = "0.1.0"
description = "Terminal-first time tracking tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.1"
]

[project.scripts]
logit = "logit.cli:cli"
